name: pipewire_gui
description: Linux desktop GUI for PipeWire / WirePlumber.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.8.0

# Ranges instead of a single major: pub picks the newest set compatible
# with your Flutter SDK (Riverpod 3 + generator 3/4, freezed 3/4).
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ">=3.0.0 <5.0.0"
  freezed_annotation: ">=3.0.0 <5.0.0"
  json_annotation: ^4.9.0
  fast_immutable_collections: ">=11.0.0 <13.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <8.0.0"
  build_runner: ">=2.4.0 <4.0.0"
  riverpod_generator: ">=3.0.0 <5.0.0"
  freezed: ">=3.0.0 <5.0.0"
  json_serializable: ">=6.9.0 <8.0.0"

flutter:
  uses-material-design: true
